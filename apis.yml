name: Getsupp
description: >-
  Getsupp was an India-based digital health and wellness platform offering supplement
  and nutrition product discovery, personalized health recommendations, and online
  consultations with certified experts (nutritionists, dietitians, and coaches). The
  company was a General Catalyst portfolio company and was subsequently absorbed into
  Eka.care. As of this enrichment pass the getsupp.in and getsupp.com domains no longer
  serve a standalone site: both resolve to Eka.io infrastructure (65.0.57.69, TLS cert
  altnames *.eka.io) and return HTTP 404 for all paths. No public developer portal, API
  documentation, OpenAPI, /.well-known/ discovery, or /llms.txt could be found. This
  profile is retained as a portfolio lead with no enrichable API surface.
